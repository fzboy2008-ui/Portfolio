<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FZBOY Arcade | 3-in-1 Mini Games</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    .arcade-canvas {
      background: radial-gradient(circle at 50% 30%, #07193b 0%, #030a1c 65%, #01040a 100%);
      border: 2px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.35);
      border-radius: 1.25rem;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="galaxy-universe text-slate-100 min-h-screen relative overflow-x-hidden font-sans select-none">

  <!-- NAVBAR -->
  <nav class="max-w-4xl mx-auto px-4 pt-6">
    <div class="nav-glass-bar flex items-center justify-between px-6 py-3.5 rounded-2xl">
      <a href="index.html" class="flex items-center gap-2 font-black tracking-wider text-xl">
        <span class="gradient-text">FZBOY</span>
      </a>
      <div class="flex items-center gap-4 text-xs sm:text-sm font-semibold">
        <a href="index.html" class="text-slate-400 hover:text-cyan-300 transition-colors">Home</a>
        <a href="projects.html" class="text-slate-400 hover:text-cyan-300 transition-colors">Showcase</a>
        <a href="game.html" class="text-cyan-300 font-bold">Arcade (3 Games)</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-6 text-center">
    
    <!-- HEADER -->
    <div class="space-y-1">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-white">
        FZBOY <span class="gradient-text">Retro Arcade</span> 🕹️
      </h1>
      <p class="text-xs sm:text-sm text-slate-400">
        Choose your game, hit Start, and beat your own personal high score!
      </p>
    </div>

    <!-- GAME SELECTOR TABS -->
    <div class="flex items-center justify-center gap-2 sm:gap-3 max-w-md mx-auto">
      <button onclick="switchGame('dino')" id="tab-dino" class="flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-[0_0_15px_rgba(6,182,212,0.4)]">
        🦖 Cyber Dino
      </button>
      <button onclick="switchGame('flappy')" id="tab-flappy" class="flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all bg-[#081836] border border-cyan-500/30 text-slate-300 hover:text-white">
        🐦 Flappy Bird
      </button>
      <button onclick="switchGame('blaster')" id="tab-blaster" class="flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all bg-[#081836] border border-cyan-500/30 text-slate-300 hover:text-white">
        🚀 Space Blaster
      </button>
    </div>

    <!-- SCOREBOARD -->
    <div class="flex items-center justify-center gap-6 text-sm font-mono">
      <div class="px-5 py-2 rounded-xl bg-[#06142e] border border-cyan-500/40 text-cyan-300">
        SCORE: <span id="currentScore" class="font-bold text-white text-lg ml-1">0</span>
      </div>
      <div class="px-5 py-2 rounded-xl bg-[#06142e] border border-yellow-500/40 text-yellow-300 flex items-center gap-1.5">
        <i data-lucide="crown" class="w-4 h-4 text-yellow-400"></i>
        <span>BEST:</span>
        <strong id="highScore" class="font-bold text-white text-lg ml-1">0</strong>
      </div>
    </div>

    <!-- CANVAS CONTAINER -->
    <div class="relative inline-block max-w-full" id="canvasContainer">
      <canvas id="arcadeCanvas" width="380" height="480" class="arcade-canvas w-full max-w-[400px] mx-auto block cursor-pointer"></canvas>

      <!-- START HINT OVERLAY -->
      <div id="startHint" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
        <div class="p-4 rounded-2xl bg-black/75 backdrop-blur-sm border border-cyan-400/40 text-center space-y-1.5 shadow-xl">
          <p id="hintTitle" class="text-sm font-extrabold text-cyan-300 animate-pulse">TAP OR PRESS SPACEBAR</p>
          <p id="hintSub" class="text-xs text-slate-300">Jump over cyber obstacles</p>
        </div>
      </div>

      <!-- GAME OVER OVERLAY -->
      <div id="gameOverOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-2xl flex-col items-center justify-center p-6 space-y-4 hidden flex">
        <h2 class="text-3xl font-black text-red-500 tracking-wider animate-pulse">GAME OVER</h2>
        
        <div class="space-y-1">
          <p class="text-sm text-slate-300">
            Final Score: <strong id="finalScore" class="text-cyan-300 font-mono text-2xl">0</strong>
          </p>
          <p class="text-xs text-yellow-300 font-mono">
            Your Best: <span id="finalHighScore">0</span>
          </p>
        </div>

        <button onclick="startGame()" class="px-8 py-3 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-extrabold text-sm shadow-[0_0_25px_rgba(6,182,212,0.5)] hover:scale-105 active:scale-95 transition-all">
          Play Again
        </button>
      </div>
    </div>

    <!-- MOBILE HELPER TOUCH CONTROLS (ONLY FOR BLASTER) -->
    <div id="blasterControls" class="hidden flex items-center justify-center gap-6 pt-1">
      <button id="btnLeft" class="px-6 py-3 rounded-xl bg-[#081c3d] border border-cyan-500/40 text-cyan-300 font-bold active:bg-cyan-500 active:text-black">◀ Left</button>
      <button id="btnFire" class="px-8 py-3 rounded-xl bg-blue-600 text-white font-bold active:bg-blue-400">🔥 Fire</button>
      <button id="btnRight" class="px-6 py-3 rounded-xl bg-[#081c3d] border border-cyan-500/40 text-cyan-300 font-bold active:bg-cyan-500 active:text-black">Right ▶</button>
    </div>

  </main>

  <script>
    lucide.createIcons();

    const canvas = document.getElementById('arcadeCanvas');
    const ctx = canvas.getContext('2d');
    const currentScoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighScoreEl = document.getElementById('finalHighScore');
    const startHint = document.getElementById('startHint');
    const hintTitle = document.getElementById('hintTitle');
    const hintSub = document.getElementById('hintSub');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const blasterControls = document.getElementById('blasterControls');

    let activeGame = 'dino'; // 'dino' | 'flappy' | 'blaster'
    let isPlaying = false;
    let waitingToStart = true;
    let score = 0;
    let frame = 0;
    let animationId = null;

    // Keys state
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space' || e.key === 'ArrowUp') {
        handleMainAction();
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    canvas.addEventListener('mousedown', handleMainAction);
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      handleMainAction();
    });

    function getHighScoreKey() {
      return `fzboy_best_${activeGame}`;
    }

    function loadHighScore() {
      const best = parseInt(localStorage.getItem(getHighScoreKey()) || '0', 10);
      highScoreEl.textContent = best;
      return best;
    }

    function saveHighScore() {
      const best = loadHighScore();
      if (score > best) {
        localStorage.setItem(getHighScoreKey(), score);
        highScoreEl.textContent = score;
      }
      finalHighScoreEl.textContent = Math.max(score, best);
    }

    /* SWITCH ACTIVE GAME */
    function switchGame(gameType) {
      activeGame = gameType;
      ['dino', 'flappy', 'blaster'].forEach(g => {
        const tab = document.getElementById(`tab-${g}`);
        if (g === gameType) {
          tab.className = "flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-[0_0_15px_rgba(6,182,212,0.4)]";
        } else {
          tab.className = "flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all bg-[#081836] border border-cyan-500/30 text-slate-300 hover:text-white";
        }
      });

      if (gameType === 'blaster') {
        blasterControls.classList.remove('hidden');
      } else {
        blasterControls.classList.add('hidden');
      }

      loadHighScore();
      resetCurrentGame();
    }

    function handleMainAction() {
      if (!isPlaying) return;
      if (waitingToStart) {
        waitingToStart = false;
        startHint.classList.add('hidden');
        gameLoop();
      }

      if (activeGame === 'dino') {
        dinoJump();
      } else if (activeGame === 'flappy') {
        flappyFlap();
      } else if (activeGame === 'blaster') {
        blasterShoot();
      }
    }

    function triggerGameOver() {
      isPlaying = false;
      finalScoreEl.textContent = score;
      saveHighScore();
      gameOverOverlay.classList.remove('hidden');
      if (animationId) cancelAnimationFrame(animationId);
    }

    function resetCurrentGame() {
      if (animationId) cancelAnimationFrame(animationId);
      gameOverOverlay.classList.add('hidden');
      startHint.classList.remove('hidden');
      score = 0;
      frame = 0;
      currentScoreEl.textContent = '0';
      waitingToStart = true;
      isPlaying = true;

      if (activeGame === 'dino') {
        initDino();
        hintTitle.textContent = "TAP OR SPACEBAR TO JUMP";
        hintSub.textContent = "Dodge cyber laser cacti";
      } else if (activeGame === 'flappy') {
        initFlappy();
        hintTitle.textContent = "TAP OR SPACEBAR TO FLY";
        hintSub.textContent = "Flap bird through glowing pipes";
      } else if (activeGame === 'blaster') {
        initBlaster();
        hintTitle.textContent = "TAP / SPACEBAR TO FIRE";
        hintSub.textContent = "Arrow keys / A-D to move ship";
      }

      drawIdleScreen();
    }

    function startGame() {
      resetCurrentGame();
    }

    /* ==========================================================
       GAME 1: CYBER DINO RUNNER
       ========================================================== */
    let dino, dinoObstacles, groundY;

    function initDino() {
      groundY = canvas.height - 70;
      dino = {
        x: 45,
        y: groundY - 36,
        w: 30,
        h: 36,
        vy: 0,
        gravity: 0.75,
        jumpPower: -12.5,
        isGrounded: true
      };
      dinoObstacles = [];
    }

    function dinoJump() {
      if (dino.isGrounded) {
        dino.vy = dino.jumpPower;
        dino.isGrounded = false;
      }
    }

    function updateDino() {
      dino.vy += dino.gravity;
      dino.y += dino.vy;

      if (dino.y >= groundY - dino.h) {
        dino.y = groundY - dino.h;
        dino.vy = 0;
        dino.isGrounded = true;
      }

      // Spawning obstacles
      if (frame % Math.max(75 - Math.floor(score / 5), 45) === 0) {
        dinoObstacles.push({
          x: canvas.width,
          y: groundY - 32,
          w: 18,
          h: 32,
          color: '#ef4444'
        });
      }

      // Move obstacles
      const dinoSpeed = 4.2 + (score * 0.05);
      for (let i = dinoObstacles.length - 1; i >= 0; i--) {
        const obs = dinoObstacles[i];
        obs.x -= dinoSpeed;

        // Collision Check
        if (
          dino.x + dino.w - 6 > obs.x &&
          dino.x + 6 < obs.x + obs.w &&
          dino.y + dino.h > obs.y
        ) {
          triggerGameOver();
          return;
        }

        if (obs.x + obs.w < -10) {
          dinoObstacles.splice(i, 1);
          score += 1;
          currentScoreEl.textContent = score;
        }
      }
    }

    function drawDino() {
      // Ground
      ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      // Draw Dino (Cyber Rex)
      ctx.fillStyle = "#22d3ee";
      ctx.shadowBlur = 10;
      ctx.shadowColor = "#22d3ee";
      // Body
      ctx.fillRect(dino.x, dino.y + 10, dino.w - 6, dino.h - 16);
      // Head
      ctx.fillRect(dino.x + 10, dino.y, 16, 14);
      // Eye
      ctx.fillStyle = "#000000";
      ctx.fillRect(dino.x + 18, dino.y + 3, 3, 3);
      // Legs
      ctx.fillStyle = "#22d3ee";
      ctx.fillRect(dino.x + 4, dino.y + dino.h - 6, 4, 6);
      ctx.fillRect(dino.x + dino.w - 12, dino.y + dino.h - 6, 4, 6);

      // Obstacles (Red Neon Cacti)
      for (let obs of dinoObstacles) {
        ctx.fillStyle = obs.color;
        ctx.shadowBlur = 14;
        ctx.shadowColor = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.fillRect(obs.x - 4, obs.y + 8, 4, 10);
        ctx.fillRect(obs.x + obs.w, obs.y + 12, 4, 10);
      }
      ctx.shadowBlur = 0;
    }

    /* ==========================================================
       GAME 2: COSMIC FLAPPY BIRD
       ========================================================== */
    let bird, flappyPipes;
    const pipeGap = 135;
    const pipeWidth = 52;

    function initFlappy() {
      bird = {
        x: 65,
        y: canvas.height / 2 - 10,
        radius: 13,
        vy: 0,
        gravity: 0.28,
        jump: -5.8,
        wingAnim: 0
      };
      flappyPipes = [];
    }

    function flappyFlap() {
      bird.vy = bird.jump;
    }

    function updateFlappy() {
      bird.vy += bird.gravity;
      bird.y += bird.vy;

      if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
        triggerGameOver();
        return;
      }

      if (frame % 85 === 0) {
        const topH = Math.floor(Math.random() * (canvas.height - pipeGap - 90)) + 40;
        flappyPipes.push({
          x: canvas.width,
          top: topH,
          bottom: canvas.height - (topH + pipeGap),
          scored: false
        });
      }

      for (let i = flappyPipes.length - 1; i >= 0; i--) {
        const p = flappyPipes[i];
        p.x -= 2.4;

        const bottomY = canvas.height - p.bottom;

        // Collision Check
        if (
          bird.x + bird.radius > p.x &&
          bird.x - bird.radius < p.x + pipeWidth &&
          (bird.y - bird.radius < p.top || bird.y + bird.radius > bottomY)
        ) {
          triggerGameOver();
          return;
        }

        if (!p.scored && p.x + pipeWidth < bird.x) {
          p.scored = true;
          score += 1;
          currentScoreEl.textContent = score;
        }

        if (p.x + pipeWidth < -10) flappyPipes.splice(i, 1);
      }
    }

    function drawFlappy() {
      // Draw Pipes
      for (let p of flappyPipes) {
        const bottomY = canvas.height - p.bottom;

        ctx.fillStyle = "#0c2854";
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#38bdf8";

        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.strokeRect(p.x, -2, pipeWidth, p.top + 2);

        ctx.fillRect(p.x, bottomY, pipeWidth, p.bottom);
        ctx.strokeRect(p.x, bottomY, pipeWidth, p.bottom + 2);
      }

      // Draw Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const tilt = Math.min(Math.max(bird.vy * 3.5, -25), 60);
      ctx.rotate((tilt * Math.PI) / 180);

      ctx.fillStyle = "#facc15";
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#facc15";
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      bird.wingAnim += 0.2;
      ctx.fillStyle = "#eab308";
      ctx.beginPath();
      ctx.ellipse(-4, Math.sin(bird.wingAnim) * 4, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye & Beak
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(5, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(6.5, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.moveTo(11, -2);
      ctx.lineTo(18, 1);
      ctx.lineTo(11, 4);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    /* ==========================================================
       GAME 3: SPACE BLASTER / ASTEROID SHOOTER
       ========================================================== */
    let ship, lasers, enemies;

    function initBlaster() {
      ship = {
        x: canvas.width / 2 - 14,
        y: canvas.height - 50,
        w: 28,
        h: 28,
        speed: 6
      };
      lasers = [];
      enemies = [];
    }

    function blasterShoot() {
      lasers.push({
        x: ship.x + ship.w / 2 - 2,
        y: ship.y,
        w: 4,
        h: 12,
        speed: 8
      });
    }

    // Touch controls for mobile
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
    document.getElementById('btnLeft').addEventListener('touchend', () => keys['ArrowLeft'] = false);
    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
    document.getElementById('btnRight').addEventListener('touchend', () => keys['ArrowRight'] = false);
    document.getElementById('btnFire').addEventListener('touchstart', (e) => { e.preventDefault(); if (isPlaying) blasterShoot(); });

    function updateBlaster() {
      if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && ship.x > 5) ship.x -= ship.speed;
      if ((keys['ArrowRight'] || keys['d'] || keys['D']) && ship.x < canvas.width - ship.w - 5) ship.x += ship.speed;

      // Spawn Enemies
      if (frame % 40 === 0) {
        const size = Math.random() * 15 + 18;
        enemies.push({
          x: Math.random() * (canvas.width - size - 10) + 5,
          y: -size,
          w: size,
          h: size,
          speed: Math.random() * 1.5 + 2.5
        });
      }

      // Update Lasers
      for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].y -= lasers[i].speed;
        if (lasers[i].y < -15) lasers.splice(i, 1);
      }

      // Update Enemies & Hit Detection
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.y += en.speed;

        // Player Collision
        if (
          ship.x < en.x + en.w &&
          ship.x + ship.w > en.x &&
          ship.y < en.y + en.h &&
          ship.y + ship.h > en.y
        ) {
          triggerGameOver();
          return;
        }

        // Laser Hits
        for (let l = lasers.length - 1; l >= 0; l--) {
          if (
            lasers[l].x < en.x + en.w &&
            lasers[l].x + lasers[l].w > en.x &&
            lasers[l].y < en.y + en.h &&
            lasers[l].y + lasers[l].h > en.y
          ) {
            enemies.splice(i, 1);
            lasers.splice(l, 1);
            score += 10;
            currentScoreEl.textContent = score;
            break;
          }
        }

        if (en.y > canvas.height) enemies.splice(i, 1);
      }
    }

    function drawBlaster() {
      // Draw Ship
      ctx.fillStyle = "#38bdf8";
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#38bdf8";
      ctx.beginPath();
      ctx.moveTo(ship.x + ship.w / 2, ship.y);
      ctx.lineTo(ship.x, ship.y + ship.h);
      ctx.lineTo(ship.x + ship.w, ship.y + ship.h);
      ctx.closePath();
      ctx.fill();

      // Lasers
      ctx.fillStyle = "#00f0ff";
      ctx.shadowColor = "#00f0ff";
      for (let l of lasers) {
        ctx.fillRect(l.x, l.y, l.w, l.h);
      }

      // Enemies
      ctx.fillStyle = "#ef4444";
      ctx.shadowColor = "#ef4444";
      for (let en of enemies) {
        ctx.beginPath();
        ctx.arc(en.x + en.w / 2, en.y + en.h / 2, en.w / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    /* ==========================================================
       MAIN LOOP & RENDER
       ========================================================== */
    function drawIdleScreen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (activeGame === 'dino') drawDino();
      else if (activeGame === 'flappy') drawFlappy();
      else if (activeGame === 'blaster') drawBlaster();
    }

    function gameLoop() {
      if (!isPlaying || waitingToStart) return;
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeGame === 'dino') {
        updateDino();
        drawDino();
      } else if (activeGame === 'flappy') {
        updateFlappy();
        drawFlappy();
      } else if (activeGame === 'blaster') {
        updateBlaster();
        drawBlaster();
      }

      animationId = requestAnimationFrame(gameLoop);
    }

    // Initialize with Dino on start
    switchGame('dino');
  </script>
</body>
</html>
