<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxy Defender | FZBOY Arcade</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    #gameCanvas {
      background: radial-gradient(circle at center, #07173b 0%, #030a1c 65%, #01040a 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.35);
      border-radius: 1.25rem;
    }
  </style>
</head>
<body class="galaxy-universe text-slate-100 min-h-screen relative overflow-x-hidden font-sans">

  <!-- NAVBAR -->
  <nav class="max-w-4xl mx-auto px-4 pt-6">
    <div class="nav-glass-bar flex items-center justify-between px-6 py-3.5 rounded-2xl">
      <a href="index.html" class="flex items-center gap-2 font-black tracking-wider text-xl">
        <span class="gradient-text">FZBOY</span>
      </a>
      <div class="flex items-center gap-4 text-xs sm:text-sm font-semibold">
        <a href="index.html" class="text-slate-400 hover:text-cyan-300 transition-colors">Home</a>
        <a href="projects.html" class="text-slate-400 hover:text-cyan-300 transition-colors">Showcase</a>
        <a href="game.html" class="text-cyan-300 font-bold">Mini Game</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-6 text-center">
    
    <div class="space-y-2">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-white">
        Galaxy <span class="gradient-text">Defender</span> 🚀
      </h1>
      <p class="text-xs sm:text-sm text-slate-400">
        Destroy incoming enemy meteors! Controls: <strong>Left/Right Arrows</strong> or <strong>A / D</strong> (or tap left/right on screen) & <strong>Spacebar</strong> to Shoot.
      </p>
    </div>

    <!-- SCOREBOARD -->
    <div class="flex items-center justify-center gap-8 py-2 text-sm font-mono">
      <div class="px-4 py-1.5 rounded-xl bg-[#06142e] border border-cyan-500/40 text-cyan-300">
        Score: <span id="gameScore" class="font-bold text-white text-base">0</span>
      </div>
      <div class="px-4 py-1.5 rounded-xl bg-[#06142e] border border-blue-500/40 text-blue-300">
        High Score: <span id="highScore" class="font-bold text-white text-base">0</span>
      </div>
    </div>

    <!-- CANVAS WRAPPER -->
    <div class="relative inline-block max-w-full">
      <canvas id="gameCanvas" width="400" height="520" class="w-full max-w-[420px] mx-auto block"></canvas>

      <!-- Game Over / Start Overlay -->
      <div id="gameOverlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 space-y-4">
        <h2 id="overlayTitle" class="text-2xl sm:text-3xl font-black text-cyan-400">READY TO PLAY?</h2>
        <p id="overlayDesc" class="text-xs sm:text-sm text-slate-300 max-w-xs">
          Dodge asteroid debris and blast cosmic invaders to survive!
        </p>
        <button id="startBtn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-sm shadow-[0_0_25px_rgba(6,182,212,0.5)] hover:scale-105 active:scale-95 transition-all">
          Launch Ship
        </button>
      </div>
    </div>

    <!-- MOBILE TOUCH CONTROLS -->
    <div class="flex sm:hidden items-center justify-center gap-4 pt-2">
      <button id="btnLeft" class="px-6 py-3 rounded-xl bg-[#081b3b] border border-cyan-500/40 text-cyan-300 active:bg-cyan-500 active:text-black font-bold">◄ Left</button>
      <button id="btnShoot" class="px-8 py-3 rounded-xl bg-blue-600 text-white font-bold active:bg-blue-400">🔥 Fire</button>
      <button id="btnRight" class="px-6 py-3 rounded-xl bg-[#081b3b] border border-cyan-500/40 text-cyan-300 active:bg-cyan-500 active:text-black font-bold">Right ►</button>
    </div>

  </main>

  <!-- Mini Game Engine -->
  <script>
    lucide.createIcons();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('gameScore');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');

    let score = 0;
    let highScore = localStorage.getItem('fzboy_highscore') || 0;
    highScoreEl.textContent = highScore;

    let isPlaying = false;
    let player, bullets, enemies, spawnTimer;

    function resetGame() {
      player = { x: canvas.width / 2 - 15, y: canvas.height - 45, w: 30, h: 30, speed: 6 };
      bullets = [];
      enemies = [];
      score = 0;
      scoreEl.textContent = '0';
      spawnTimer = 0;
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' && isPlaying) {
        shootBullet();
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Mobile buttons
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
    document.getElementById('btnLeft').addEventListener('touchend', () => keys['ArrowLeft'] = false);
    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
    document.getElementById('btnRight').addEventListener('touchend', () => keys['ArrowRight'] = false);
    document.getElementById('btnShoot').addEventListener('touchstart', (e) => { e.preventDefault(); if (isPlaying) shootBullet(); });

    function shootBullet() {
      bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10, speed: 8 });
    }

    startBtn.addEventListener('click', () => {
      resetGame();
      isPlaying = true;
      overlay.classList.add('hidden');
      loop();
    });

    function gameOver() {
      isPlaying = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('fzboy_highscore', highScore);
        highScoreEl.textContent = highScore;
      }
      overlayTitle.textContent = "GAME OVER!";
      overlayDesc.textContent = `You scored ${score} points!`;
      startBtn.textContent = "Play Again";
      overlay.classList.remove('hidden');
    }

    function loop() {
      if (!isPlaying) return;

      // Update player
      if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 0) player.x -= player.speed;
      if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.w) player.x += player.speed;

      // Spawn enemies
      spawnTimer++;
      if (spawnTimer % 45 === 0) {
        const size = Math.random() * 20 + 20;
        enemies.push({
          x: Math.random() * (canvas.width - size),
          y: -size,
          w: size,
          h: size,
          speed: Math.random() * 2 + 2.5
        });
      }

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -10) bullets.splice(i, 1);
      }

      // Update enemies & collision
      for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].y += enemies[i].speed;

        // Player collision
        if (
          player.x < enemies[i].x + enemies[i].w &&
          player.x + player.w > enemies[i].x &&
          player.y < enemies[i].y + enemies[i].h &&
          player.y + player.h > enemies[i].y
        ) {
          gameOver();
          return;
        }

        // Bullet hit enemy
        for (let b = bullets.length - 1; b >= 0; b--) {
          if (
            bullets[b].x < enemies[i].x + enemies[i].w &&
            bullets[b].x + bullets[b].w > enemies[i].x &&
            bullets[b].y < enemies[i].y + enemies[i].h &&
            bullets[b].y + bullets[b].h > enemies[i].y
          ) {
            enemies.splice(i, 1);
            bullets.splice(b, 1);
            score += 10;
            scoreEl.textContent = score;
            break;
          }
        }

        // Bottom border
        if (enemies[i] && enemies[i].y > canvas.height) {
          enemies.splice(i, 1);
        }
      }

      // Render Screen
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Ship
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.closePath();
      ctx.shadowBlur = 10;
      ctx.shadowColor = "#38bdf8";
      ctx.fill();

      // Draw Bullets
      ctx.fillStyle = "#22d3ee";
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#22d3ee";
      for (let b of bullets) {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }

      // Draw Enemies
      ctx.fillStyle = "#ef4444";
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#ef4444";
      for (let en of enemies) {
        ctx.beginPath();
        ctx.arc(en.x + en.w / 2, en.y + en.h / 2, en.w / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
