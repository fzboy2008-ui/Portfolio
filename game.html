<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird | FZBOY Arcade</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    #flappyCanvas {
      background: radial-gradient(circle at 50% 35%, #0c234b 0%, #040e21 65%, #010612 100%);
      border: 2px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.35);
      border-radius: 1.25rem;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="galaxy-universe text-slate-100 min-h-screen relative overflow-x-hidden font-sans select-none">

  <!-- NAVBAR -->
  <nav class="max-w-4xl mx-auto px-4 pt-6">
    <div class="nav-glass-bar flex items-center justify-between px-6 py-3.5 rounded-2xl">
      <a href="index.html" class="flex items-center gap-2 font-black tracking-wider text-xl">
        <span class="gradient-text">FZBOY</span>
      </a>
      <div class="flex items-center gap-4 text-xs sm:text-sm font-semibold">
        <a href="index.html" class="text-slate-400 hover:text-cyan-300 transition-colors">Home</a>
        <a href="projects.html" class="text-slate-400 hover:text-cyan-300 transition-colors">Showcase</a>
        <a href="game.html" class="text-cyan-300 font-bold">Flappy Bird</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-6 text-center">
    
    <!-- TITLE -->
    <div class="space-y-1">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-white">
        Cosmic <span class="gradient-text">Flappy Bird</span> 🐦
      </h1>
      <p class="text-xs sm:text-sm text-slate-400">
        Tap, click, or press <strong>Spacebar</strong> to fly! Dodge the cyber pillars.
      </p>
    </div>

    <!-- SCOREBOARD (CURRENT SCORE & PERSONAL BEST) -->
    <div class="flex items-center justify-center gap-5 text-sm font-mono">
      <div class="px-5 py-2 rounded-xl bg-[#06142e] border border-cyan-500/40 text-cyan-300">
        SCORE: <span id="currentScore" class="font-bold text-white text-lg ml-1">0</span>
      </div>
      <div class="px-5 py-2 rounded-xl bg-[#06142e] border border-yellow-500/40 text-yellow-300 flex items-center gap-1.5">
        <i data-lucide="crown" class="w-4 h-4 text-yellow-400"></i>
        <span>BEST:</span>
        <strong id="highScore" class="font-bold text-white text-lg ml-1">0</strong>
      </div>
    </div>

    <!-- CANVAS WRAPPER -->
    <div class="relative inline-block max-w-full" id="canvasWrapper">
      <canvas id="flappyCanvas" width="380" height="520" class="w-full max-w-[400px] mx-auto block cursor-pointer"></canvas>

      <!-- TAP TO START HINT -->
      <div id="startHint" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
        <div class="p-4 rounded-2xl bg-black/65 backdrop-blur-sm border border-cyan-400/40 text-center space-y-1.5 shadow-xl">
          <p class="text-sm font-extrabold text-cyan-300 animate-pulse">TAP OR PRESS SPACEBAR</p>
          <p class="text-xs text-slate-300">Fly bird through the gates</p>
        </div>
      </div>

      <!-- GAME OVER OVERLAY -->
      <div id="gameOverOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-2xl flex-col items-center justify-center p-6 space-y-4 hidden flex">
        <h2 class="text-3xl font-black text-red-500 tracking-wider animate-pulse">GAME OVER</h2>
        
        <div class="space-y-1">
          <p class="text-sm text-slate-300">
            Score: <strong id="finalScore" class="text-cyan-300 font-mono text-2xl">0</strong>
          </p>
          <p class="text-xs text-yellow-300 font-mono">
            Best Record: <span id="finalHighScore">0</span>
          </p>
        </div>

        <button id="btnPlayAgain" class="px-8 py-3 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-extrabold text-sm shadow-[0_0_25px_rgba(6,182,212,0.5)] hover:scale-105 active:scale-95 transition-all">
          Play Again
        </button>
      </div>
    </div>

  </main>

  <script>
    lucide.createIcons();

    /* ==========================================================
       FLAPPY BIRD ENGINE (CLASSIC BIRD & PERSONAL HIGH SCORE)
       ========================================================== */
    const canvas = document.getElementById('flappyCanvas');
    const ctx = canvas.getContext('2d');
    const currentScoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const finalHighScoreEl = document.getElementById('finalHighScore');
    const startHint = document.getElementById('startHint');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const btnPlayAgain = document.getElementById('btnPlayAgain');

    // Personal High Score from Local Storage
    let highScore = parseInt(localStorage.getItem('fzboy_flappy_personal_best') || '0', 10);
    highScoreEl.textContent = highScore;

    let isPlaying = false;
    let waitingToFlap = true;
    let score = 0;
    let frame = 0;

    // Bird Object
    let bird = {
      x: 70,
      y: 220,
      radius: 13,
      vy: 0,
      gravity: 0.28,
      jump: -5.8,
      wingAnim: 0
    };

    let pipes = [];
    let particles = [];
    const pipeGap = 140;
    const pipeWidth = 52;
    const pipeSpeed = 2.4;

    function resetGame() {
      bird.y = canvas.height / 2 - 10;
      bird.vy = 0;
      bird.wingAnim = 0;
      pipes = [];
      particles = [];
      score = 0;
      frame = 0;
      currentScoreEl.textContent = '0';
      waitingToFlap = true;
      isPlaying = true;
      startHint.classList.remove('hidden');
      gameOverOverlay.classList.add('hidden');
      drawIdle();
    }

    function flap() {
      if (!isPlaying) return;
      if (waitingToFlap) {
        waitingToFlap = false;
        startHint.classList.add('hidden');
        loop();
      }
      bird.vy = bird.jump;

      // Small feathers / wind dust particles
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: bird.x - 8,
          y: bird.y,
          vx: -(Math.random() * 2 + 1),
          vy: (Math.random() - 0.5) * 2,
          life: 1,
          size: Math.random() * 2.5 + 1.5,
          color: Math.random() > 0.4 ? "#facc15" : "#38bdf8"
        });
      }
    }

    // Input Events
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        flap();
        e.preventDefault();
      }
    });

    canvas.addEventListener('mousedown', flap);
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      flap();
    });

    btnPlayAgain.addEventListener('click', () => {
      resetGame();
    });

    function triggerCrash() {
      isPlaying = false;
      finalScoreEl.textContent = score;

      // Update Personal Best
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('fzboy_flappy_personal_best', highScore);
        highScoreEl.textContent = highScore;
      }
      finalHighScoreEl.textContent = highScore;

      gameOverOverlay.classList.remove('hidden');
    }

    function drawIdle() {
      if (!waitingToFlap) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackgroundGrid();
      drawBird();
      requestAnimationFrame(drawIdle);
    }

    function drawBackgroundGrid() {
      ctx.strokeStyle = "rgba(56, 189, 248, 0.08)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 35) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
    }

    // DRAW ANIMATED FLAPPY BIRD 🐦
    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);

      // Smooth tilt rotation based on vertical speed
      const tilt = Math.min(Math.max(bird.vy * 3.5, -25), 60);
      ctx.rotate((tilt * Math.PI) / 180);

      // Bird Body (Golden Yellow Circle)
      ctx.fillStyle = "#facc15";
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#facc15";
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Belly / Light Chest
      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(-2, 3, bird.radius * 0.65, 0, Math.PI * 2);
      ctx.fill();

      // Wing (Flapping Animation)
      bird.wingAnim += 0.15;
      const wingOffset = Math.sin(bird.wingAnim) * 4;
      ctx.fillStyle = "#eab308";
      ctx.beginPath();
      ctx.ellipse(-4, wingOffset, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye (White with black pupil)
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(5, -4, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(6.5, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak (Orange Triangle)
      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.moveTo(11, -2);
      ctx.lineTo(19, 1);
      ctx.lineTo(11, 4);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      if (!isPlaying || waitingToFlap) return;
      frame++;

      // Bird Physics
      bird.vy += bird.gravity;
      bird.y += bird.vy;

      // Floor & Ceiling Collision
      if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
        triggerCrash();
        return;
      }

      // Spawning Pipes
      if (frame % 85 === 0) {
        const topHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 90)) + 40;
        pipes.push({
          x: canvas.width,
          top: topHeight,
          bottom: canvas.height - (topHeight + pipeGap),
          scored: false
        });
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackgroundGrid();

      // Draw Pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= pipeSpeed;

        // Top Pipe
        ctx.fillStyle = "#081b3b";
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2;
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.strokeRect(p.x, -2, pipeWidth, p.top + 2);

        // Bottom Pipe
        const bottomY = canvas.height - p.bottom;
        ctx.fillRect(p.x, bottomY, pipeWidth, p.bottom);
        ctx.strokeRect(p.x, bottomY, pipeWidth, p.bottom + 2);

        // Glowing Pipe Rim Caps
        ctx.fillStyle = "#06b6d4";
        ctx.fillRect(p.x - 2, p.top - 7, pipeWidth + 4, 7);
        ctx.fillRect(p.x - 2, bottomY, pipeWidth + 4, 7);

        // Circular Bird Collision Check
        if (
          bird.x + bird.radius > p.x &&
          bird.x - bird.radius < p.x + pipeWidth &&
          (bird.y - bird.radius < p.top || bird.y + bird.radius > bottomY)
        ) {
          triggerCrash();
          return;
        }

        // Score increment
        if (!p.scored && p.x + pipeWidth < bird.x) {
          p.scored = true;
          score++;
          currentScoreEl.textContent = score;
        }

        if (p.x + pipeWidth < -10) pipes.splice(i, 1);
      }

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;

        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      drawBird();
      requestAnimationFrame(loop);
    }

    // Start in ready state
    resetGame();
  </script>
</body>
</html>
